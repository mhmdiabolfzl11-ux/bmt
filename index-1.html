
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رَد | وبلاگ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --ink:#0d1b24; --muted:#5b6b76; --line:#e1e6ea;
  --brand:#0e7c86; --hi:#ffd24a; --hero:#0b1f2a; --hero-ink:#f2f6f8;
  --radius:18px; --shadow:0 1px 2px rgba(13,27,36,.06),0 12px 32px -12px rgba(13,27,36,.18);
}
:root[data-theme="dark"]{
  --bg:#08141b; --surface:#0f222d; --ink:#eef3f6; --muted:#8fa3b0; --line:#1c3442;
  --brand:#4fd1d9; --hero:#050e13; --shadow:0 12px 32px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:55}
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.display{font-family:"Lalezar","Vazirmatn",sans-serif;font-weight:400;line-height:1.35}
#progress{position:fixed;top:0;right:0;height:3px;width:0;background:var(--hi);z-index:60}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-size:1.9rem;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 30%,transparent)}
.links{display:flex;gap:26px;align-items:center;font-weight:500}
.links a:hover{color:var(--brand)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.1rem}
.cta{background:var(--ink);color:var(--bg);padding:8px 20px;border-radius:99px;font-weight:700;border:0;cursor:pointer}
@media(max-width:640px){.links a:not(.cta){display:none}}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden;padding:84px 0 110px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.hero::before{width:620px;height:620px;left:-180px;top:-240px}
.hero::after{width:380px;height:380px;left:-60px;top:-120px;border-color:rgba(255,210,74,.35)}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);max-width:760px;position:relative}
.hero mark{background:var(--hi);color:#0b1f2a;padding:0 14px;border-radius:12px}
.hero p{color:#a9bcc6;max-width:520px;margin-top:20px;font-size:1.1rem;position:relative}
.sub{display:flex;gap:10px;margin-top:34px;max-width:480px;position:relative}
.sub input{flex:1;min-width:0;padding:13px 20px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff}
.sub input::placeholder{color:#8aa0ab}
.sub button{background:var(--hi);color:#0b1f2a;border:0;border-radius:99px;padding:0 26px;font-weight:700;cursor:pointer}
.note{margin-top:10px;color:var(--hi);min-height:1.8em;font-size:.9rem;position:relative}

/* featured */
.featured{margin-top:-64px;position:relative}
.feat{display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.feat .txt{padding:40px}
.feat h2{font-size:2.1rem;margin:10px 0}
.feat p{color:var(--muted)}
@media(max-width:820px){.feat{grid-template-columns:1fr}.feat .txt{padding:26px}}

.cover{position:relative;min-height:220px;overflow:hidden;background:hsl(var(--h) 55% 28%)}
.cover::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-12%;top:-20%;background:hsl(calc(var(--h) + 30) 80% 62%)}
.cover::after{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:28%;left:-8%;bottom:-25%;background:hsl(calc(var(--h) - 20) 60% 18%);transform:rotate(18deg)}
.cover b{position:absolute;z-index:1;left:20px;bottom:14px;font-family:"Lalezar";font-size:3.4rem;color:rgba(255,255,255,.9);line-height:1}

.chip{display:inline-block;padding:2px 14px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-size:.82rem;font-weight:700}
.meta{color:var(--muted);font-size:.85rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.readmore{display:inline-block;margin-top:18px;font-weight:700;color:var(--brand)}

/* grid */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:64px 0 26px;flex-wrap:wrap}
.bar h3{font-size:2rem}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:5px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card .cover{min-height:170px}
.card .in{padding:22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{font-size:1.15rem;font-weight:700;line-height:1.8}
.card p{color:var(--muted);font-size:.93rem}
.card .meta{margin-top:auto;padding-top:10px}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}

/* post */
.post{max-width:700px;margin:0 auto;padding:48px 22px 20px}
.post h1{font-size:clamp(2.2rem,5vw,3.2rem);margin:14px 0}
.post .cover{border-radius:var(--radius);min-height:260px;margin:30px 0}
.post p{font-size:1.1rem;margin-bottom:1.4em}
.post blockquote{border-inline-start:4px solid var(--hi);padding:4px 20px;margin:28px 0;font-size:1.3rem;font-weight:500}
.author{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:40px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:"Lalezar";font-size:1.6rem;flex:none}
.author small{color:var(--muted);display:block;line-height:1.8}

footer{margin-top:90px;border-top:1px solid var(--line);padding:34px 0 46px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
/* ticker */
.ticker{background:var(--ink);color:var(--bg);font-size:.88rem;overflow-x:auto;white-space:nowrap}
.ticker .wrap{display:flex;gap:30px;align-items:center;height:38px}
.ticker b{color:var(--hi);margin-inline-start:6px}
:root[data-theme="dark"] .ticker{background:#0f222d;color:var(--ink)}
/* market */
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:820px){.mkt{grid-template-columns:1fr}}
.usd,.tbl,.n,.lock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.big{font-family:"Lalezar";font-size:3.4rem;line-height:1.3;margin:8px 0}
.big small{font-size:1.1rem;font-family:"Vazirmatn";color:var(--muted)}
.dn{color:#d64545;font-weight:700}
.conv{display:block;margin-top:18px;font-size:.9rem;color:var(--muted)}
.conv input,.box input{width:100%;padding:11px 16px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.conv-out{margin-top:10px;font-weight:700;font-size:1.15rem;color:var(--brand)}
table{width:100%;border-collapse:collapse}
td{padding:11px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:left;font-weight:700}
.lock{display:flex;flex-direction:column;gap:14px;align-items:flex-start;justify-content:center;height:100%;background:color-mix(in srgb,var(--hi) 16%,var(--surface))}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:20px}
.n h4{font-size:1.1rem;line-height:1.9;margin:8px 0 4px}
.n p{color:var(--muted);font-size:.93rem}
.n .meta{margin-top:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,14,19,.65);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:20px}
.modal[hidden]{display:none}
.box{background:var(--surface);border-radius:24px;padding:32px;width:100%;max-width:400px;position:relative;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:2rem}
.box .x{position:absolute;top:14px;left:16px;border:0;background:none;color:var(--muted);font-size:1.8rem;cursor:pointer}
.box form{display:flex;flex-direction:column;gap:12px}
.box input{margin-top:0}
.err{color:#d64545;min-height:1.6em;font-size:.9rem}
.box .cta{padding:12px;font-size:1rem}
.sw{text-align:center;color:var(--brand);font-weight:500}
.psearch{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:200px}
.src{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.src a{padding:2px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--brand);font-weight:500}
.box.wide{max-width:620px;max-height:88vh;overflow:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-inline-end:34px}
.tab{padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.box .hint{font-size:.88rem;color:var(--muted)}
.box textarea,.box select{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.box input[type=checkbox]{width:auto;margin:0 0 0 8px}
.btn2{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-weight:500}
.danger{color:#d64545}
.box details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.box summary{cursor:pointer;font-weight:700}
.box details>*:not(summary){margin-top:10px}
.box hr{border:0;border-top:1px solid var(--line)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.li button{border:0;background:none;color:#d64545;cursor:pointer;font:inherit}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="progress"></div>
<nav>
  <div class="wrap">
    <a class="logo display" href="#"><i></i>رَد</a>
    <div class="links">
      <a href="#list">نوشته‌ها</a>
      <a href="#news">اخبار</a>
      <a href="#market">بازار ارز</a>
      <a href="#about">درباره</a>
      <button class="icon-btn" id="theme" aria-label="تغییر حالت روشن و تیره">◐</button>
      <button class="cta" id="authBtn">ورود / عضویت</button>
    </div>
  </div>
</nav>
<div class="ticker"><div class="wrap" id="ticker"></div></div>

<div id="app"></div>

<div class="modal" id="panel" hidden onclick="if(event.target===this)closePanel()">
  <div class="box wide" role="dialog" aria-modal="true" aria-label="پنل کاربری">
    <button class="x" onclick="closePanel()" aria-label="بستن">×</button>
    <div id="panelBody"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> رَد — با عشق نوشته شده.</span>
    <span>تماس: <a href="mailto:mhmdi.aboalfzl@gmail.com"><b>mhmdi.aboalfzl@gmail.com</b></a></span>
  </div>
</footer>

<div class="modal" id="modal" hidden onclick="if(event.target===this)closeModal()">
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mt">
    <button class="x" onclick="closeModal()" aria-label="بستن">×</button>
    <h3 id="mt" class="display"></h3>
    <form id="authForm" onsubmit="submitAuth(event)">
      <input id="fName" placeholder="نام شما" autocomplete="name">
      <input id="fEmail" type="email" required placeholder="ایمیل" autocomplete="email">
      <input id="fPass" type="password" required minlength="6" placeholder="رمز عبور (حداقل ۶ کاراکتر)">
      <div class="err" id="err"></div>
      <button class="cta" id="fBtn"></button>
    </form>
    <p class="sw"><a href="#" onclick="switchMode(event)" id="sw"></a></p>
  </div>
</div>

<script>
// ✏️ نوشته‌های خود را اینجا ویرایش یا اضافه کنید
const SITE = { name: "رَد", author: "نام شما", bio: "می‌نویسم درباره‌ی طراحی، فناوری و زندگی روزمره." };
const posts = [
  { id:"focus", title:"هنر تمرکز در دنیای پر از حواس‌پرتی", cat:"بهره‌وری", date:"۱۸ آبان ۱۴۰۵", min:6, h:190,
    lead:"تمرکز یک استعداد نیست؛ مهارتی است که با چند عادت ساده تمرین می‌شود.",
    body:["هر اعلان گوشی یک درخواست کوچک برای توجه شماست. وقتی ده‌ها بار در روز جواب می‌دهیم، مغز یاد می‌گیرد که هیچ کاری را تا آخر دنبال نکند.","قاعده‌ی من ساده است: هر روز یک بلوک نود دقیقه‌ای بدون موبایل. نه بیشتر، نه کمتر.","> تمرکز یعنی گفتن «نه» به هزار چیز خوب.","بعد از دو هفته، نتیجه را در کیفیت کارها می‌بینید، نه فقط در تعدادشان."]},
  { id:"design-basics", title:"پنج اصل طراحی که هر کسی باید بداند", cat:"طراحی", date:"۱۵ آبان ۱۴۰۵", min:5, h:12,
    lead:"طراحی خوب جادو نیست؛ مجموعه‌ای از تصمیم‌های کوچک و آگاهانه است.",
    body:["فاصله‌گذاری، تایپوگرافی، رنگ، تضاد و ریتم؛ این پنج مورد ۹۰ درصد کیفیت یک صفحه را تعیین می‌کنند.","اگر فقط یک چیز را بهتر کنید، فضای خالی را بیشتر کنید. صفحه‌ای که نفس می‌کشد، حرفه‌ای‌تر دیده می‌شود."]},
  { id:"learn-code", title:"برنامه‌نویسی را از کجا شروع کنیم؟", cat:"فناوری", date:"۱۰ آبان ۱۴۰۵", min:7, h:265,
    lead:"بهترین راه یادگیری، ساختن یک پروژه‌ی کوچک و واقعی است.",
    body:["دیدن آموزش‌های بی‌شمار شما را برنامه‌نویس نمی‌کند. ساختن یک چیز ساده، مثل همین وبلاگ، بیشتر یاد می‌دهد.","خراب کردن و درست کردن، قلب یادگیری است. از خطاها نترسید."]},
  { id:"morning", title:"روتین صبح؛ کمتر، اما ثابت", cat:"سبک زندگی", date:"۵ آبان ۱۴۰۵", min:4, h:35,
    lead:"روتینی که هر روز دوام بیاورد، از روتین عالی ولی نیمه‌کاره بهتر است.",
    body:["من فقط سه کار می‌کنم: یک لیوان آب، ده دقیقه حرکت و نوشتن اولویت امروز.","> کوچک شروع کنید تا بتوانید ادامه بدهید.","ثبات، هر بار، از شدت برنده می‌شود."]},
  { id:"ai-tools", title:"هوش مصنوعی چطور کارهای روزمره را ساده می‌کند", cat:"فناوری", date:"۱ آبان ۱۴۰۵", min:6, h:150,
    lead:"از پیش‌نویس ایمیل تا خلاصه‌ی گزارش؛ چند کاربرد واقعی که واقعاً وقت آزاد می‌کنند.",
    body:["بهترین استفاده از ابزارهای هوشمند، سپردن کارهای تکراری به آن‌هاست تا شما روی تصمیم‌های مهم تمرکز کنید.","همیشه خروجی را خودتان بخوانید و بازبینی کنید؛ مسئولیت نهایی با شماست."]},
  { id:"sleep", title:"خواب خوب؛ ارزان‌ترین دارو برای تمرکز", cat:"سلامت", date:"۲۰ مهر ۱۴۰۵", min:5, h:210,
    lead:"کیفیت خواب بیشتر از طول آن اهمیت دارد و با چند تغییر کوچک بهتر می‌شود.",
    body:["ساعت خواب و بیداری ثابت، اتاق خنک و تاریک و دوری از صفحه‌ی نمایش یک ساعت قبل از خواب، سه کاری هستند که بیشترین اثر را دارند.","> بدن عادت را دوست دارد، نه شدت را.","قهوه را بعد از ظهر کنار بگذارید و ببینید بعد از یک هفته چه تغییری می‌کند."]},
  { id:"budget", title:"بودجه‌بندی ماهانه به زبان ساده", cat:"مالی", date:"۱۵ مهر ۱۴۰۵", min:6, h:95,
    lead:"قانون ۵۰-۳۰-۲۰ یکی از ساده‌ترین روش‌ها برای مدیریت درآمد است.",
    body:["نیمی از درآمد برای نیازهای ضروری، سی درصد برای خواسته‌ها و بیست درصد برای پس‌انداز. نسبت‌ها را با شرایط خودتان تنظیم کنید.","مهم‌تر از درصدها، ثبت هزینه‌هاست. وقتی خرج‌ها را ببینید، خودتان می‌فهمید کجا باید کم کنید.","همیشه یک صندوق اضطراری معادل چند ماه هزینه کنار بگذارید."]},
  { id:"phone-photo", title:"عکاسی با موبایل؛ شش نکته‌ی حرفه‌ای", cat:"هنر", date:"۱۰ مهر ۱۴۰۵", min:4, h:300,
    lead:"دوربین خوب مهم است، اما نور و ترکیب‌بندی مهم‌تر است.",
    body:["از نور طبیعی استفاده کنید و ساعت‌های اول صبح و غروب را از دست ندهید. شبکه‌ی خطوط دوربین را روشن کنید تا ترکیب‌بندی بهتری داشته باشید.","لنز را تمیز کنید؛ ساده‌ترین کاری که کمتر کسی انجام می‌دهد."]},
  { id:"remote-work", title:"دورکاری بدون فرسودگی", cat:"بهره‌وری", date:"۵ مهر ۱۴۰۵", min:6, h:165,

/* ===== قیمت زنده =====
   آدرس API قیمت را در url بگذارید (باید CORS را مجاز کند). اگر خالی باشد، از داده‌ی دستی MARKET استفاده می‌شود.
   تابع map باید پاسخ API را به نرخ‌های تومانی تبدیل کند؛ نمونه‌ی زیر برای قالبی مثل {"usd_sell":{"value":"264900"}} است. */
const LIVE = { url:"", refreshSec:60,
  map: j => ({ usd:+j.usd_sell?.value, eur:+j.eur?.value, gbp:+j.gbp?.value, aed:+j.aed_sell?.value, cad:+j.cad?.value, try:+j.try?.value }) };
function updateMarket(){
  const v = $("#usdIn")?.value;
  $("#market").outerHTML = marketHTML();
  if(v) $("#usdIn").value = v;
  conv();
}
async function loadLive(){
  if(!LIVE.url) return;
  try{
    const r = await fetch(LIVE.url, {cache:"no-store"});
    const m = LIVE.map(await r.json()), idx = {usd:0,eur:1,gbp:2,aed:3,cad:4,try:5};
    let ok = false;
    for(const k in idx){ if(m[k] > 0){ MARKET.items[idx[k]].v = m[k]; ok = true; } }
    if(ok){
      MARKET.live = true;
      MARKET.date = new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}) + " (زنده)";
      renderTicker(); if($("#market")) updateMarket();
    }
  }catch(e){ console.warn("live rates failed", e); }
  setTimeout(loadLive, LIVE.refreshSec*1000);
}

/* ===== عضویت و ورود (ذخیره در مرورگر؛ برای حساب واقعی به سرور وصل کنید) ===== */
const mem = {};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return mem[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
const users = () => store.get("rad_users") || {};
/* ✏️ برای حساب‌های واقعی (ورود از هر دستگاه): پروژه‌ی Firebase بسازید و مقادیر را اینجا بگذارید.
   تا وقتی apiKey خالی است، حساب‌ها فقط در همین مرورگر ذخیره می‌شوند. */
const FIREBASE_CONFIG = { apiKey:"", authDomain:"", projectId:"", appId:"" };
const USE_FIREBASE = !!FIREBASE_CONFIG.apiKey;
let cur = null, fb = null;
const session = () => cur;
const localSession = () => { const e = store.get("rad_session"), u = users()[e]; return e && u ? {email:e, name:u.name} : null; };
async function initAuth(){
  if(USE_FIREBASE){
    try{
      const base = "https://www.gstatic.com/firebasejs/10.12.2/";
      const [{initializeApp}, A] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js")]);
      fb = { ...A, auth: A.getAuth(initializeApp(FIREBASE_CONFIG)) };
      fb.onAuthStateChanged(fb.auth, u => { cur = u ? {email:u.email, name:u.displayName || u.email.split("@")[0]} : null; refresh(); });
      return;
    }catch(e){ console.warn("Firebase failed, using local mode", e); }
  }
  cur = localSession(); refresh();
}
const fbErr = c => ({
  "auth/email-already-in-use":"این ایمیل قبلاً ثبت شده است. وارد شوید.",
  "auth/invalid-credential":"ایمیل یا رمز عبور درست نیست.",
  "auth/wrong-password":"ایمیل یا رمز عبور درست نیست.",
  "auth/user-not-found":"ایمیل یا رمز عبور درست نیست.",
  "auth/weak-password":"رمز عبور باید حداقل ۶ کاراکتر باشد.",
  "auth/invalid-email":"ایمیل واردشده درست نیست."
}[c] || "خطایی رخ داد. دوباره تلاش کنید.");
async function sha(t){
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  let h=0; for(const c of t) h=(h*31+c.charCodeAt(0))|0; return String(h);
}
let mode = "signup";
function paint(){
  const s = mode==="signup";
  $("#mt").textContent = s ? "عضویت رایگان" : "ورود به حساب";
  $("#fBtn").textContent = s ? "ساخت حساب" : "ورود";
  $("#fName").style.display = s ? "" : "none";
  $("#sw").textContent = s ? "حساب دارید؟ وارد شوید" : "حساب ندارید؟ عضو شوید";
  $("#fPass").autocomplete = s ? "new-password" : "current-password";
}
function openModal(m, email){ mode=m; $("#modal").hidden=false; paint(); if(email) $("#fEmail").value=email; $("#fEmail").focus(); }
function closeModal(){ $("#modal").hidden=true; $("#err").textContent=""; }
function switchMode(e){ e.preventDefault(); mode = mode==="signup" ? "login" : "signup"; paint(); }
async function submitAuth(e){
  e.preventDefault();
  const email = $("#fEmail").value.trim().toLowerCase(), pass = $("#fPass").value, name = $("#fName").value.trim(), err = $("#err");
  err.textContent = "";
  if(fb){
    try{
      if(mode==="signup"){
        const c = await fb.createUserWithEmailAndPassword(fb.auth, email, pass);
        if(name) await fb.updateProfile(c.user, {displayName:name});
        cur = {email, name: name || email.split("@")[0]};
      } else await fb.signInWithEmailAndPassword(fb.auth, email, pass);
    }catch(x){ err.textContent = fbErr(x.code); return; }
  } else {
    const U = users();
    if(mode==="signup"){
      if(U[email]){ err.textContent = "این ایمیل قبلاً ثبت شده است. وارد شوید."; return; }
      const salt = Math.random().toString(36).slice(2);
      U[email] = { name: name || email.split("@")[0], salt, hash: await sha(salt+pass) };
      store.set("rad_users", U);
    } else {
      const u = U[email];
      if(!u || u.hash !== await sha(u.salt+pass)){ err.textContent = "ایمیل یا رمز عبور درست نیست."; return; }
    }
    store.set("rad_session", email); cur = localSession();
  }
  closeModal(); e.target.reset(); refresh();
}
function refresh(){ const y=scrollY; authUI(); route(); scrollTo(0,y); }
function logout(){ if(fb) fb.signOut(fb.auth); else { store.set("rad_session",null); cur=null; refresh(); } }
function authUI(){
  const s = session(), b = $("#authBtn");
  b.textContent = s ? "👤 " + s.name : "ورود / عضویت";
  b.onclick = () => s ? openPanel() : openModal("login");
}
addEventListener("keydown", e => { if(e.key==="Escape"){ closeModal(); closePanel(); } });

function article(p){
  const rel = posts.filter(x=>x.id!==p.id).slice(0,2);
  app.innerHTML = `<article class="post">
    <a href="#" class="readmore" style="margin:0">→ بازگشت</a><br><br>
    <span class="chip">${esc(p.cat)}</span>
    <h1 class="display">${esc(p.title)}</h1>
    <div class="meta"><span>${p.date}</span><span>·</span><span>${p.min} دقیقه مطالعه</span></div>
    <div class="cover" style="--h:${p.h}"><b>${esc(p.cat)}</b></div>
    <p style="font-size:1.25rem;font-weight:500">${esc(p.lead)}</p>
    ${p.body.map(t=>t.startsWith(">")?`<blockquote>${esc(t.slice(1).trim())}</blockquote>`:`<p>${esc(t)}</p>`).join("")}
    <div class="author"><div class="avatar">${esc(SITE.author[0])}</div><div><b>${esc(SITE.author)}</b><small>${esc(SITE.bio)}</small></div></div>
  </article>
  <section class="wrap"><div class="bar"><h3 class="display">بیشتر بخوانید</h3></div><div class="grid">${rel.map(card).join("")}</div></section>`;
}

function route(){
  const p = posts.find(x=>x.id===location.hash.slice(1));
  if(p){ article(p); document.title = p.title + " | " + SITE.name; window.scrollTo(0,0); }
  else if(["#about","#subscribe","#market","#news","#list"].includes(location.hash)){ if(!$("#grid")) home(); setTimeout(()=>$(location.hash)?.scrollIntoView(),50); }
  else { document.title = SITE.name + " | وبلاگ"; home(); window.scrollTo(0,0); }
}

// ===== تنظیمات، حساب و پنل سازنده =====
const ADMIN_EMAIL = "mhmdi.aboalfzl@gmail.com";
const root = document.documentElement;
const prefs = Object.assign({theme:"auto", font:16, ticker:true}, store.get("rad_prefs") || {});
function applyPrefs(){
  if(prefs.theme==="auto"){ delete root.dataset.theme; if(matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme="dark"; }
  else root.dataset.theme = prefs.theme;
  document.body.style.fontSize = prefs.font + "px";
  $(".ticker").style.display = prefs.ticker ? "" : "none";
}
function setPref(k,v){ prefs[k] = k==="font" ? +v : k==="ticker" ? !!v : v; store.set("rad_prefs",prefs); applyPrefs(); }
$("#theme").onclick = () => setPref("theme", root.dataset.theme==="dark" ? "light" : "dark");

// محتوای ذخیره‌شده توسط سازنده (فقط در همین مرورگر)
const saved = store.get("rad_content");
if(saved){
  if(saved.posts) posts.splice(0, posts.length, ...saved.posts);
  if(saved.NEWS) NEWS.splice(0, NEWS.length, ...saved.NEWS);
  if(saved.MARKET) Object.assign(MARKET, saved.MARKET);
}
const persist = () => { store.set("rad_content", {posts, NEWS, MARKET}); refresh(); };

let tab = "acc";
const isAdmin = () => session()?.email === ADMIN_EMAIL;
function msg(t, ok=true){ const e = $("#pMsg"); if(e){ e.textContent = t; e.style.color = ok ? "var(--brand)" : "#d64545"; } }
function openPanel(t){ if(!session()){ openModal("login"); return; } tab = t || "acc"; $("#panel").hidden = false; drawPanel(); }
function closePanel(){ $("#panel").hidden = true; }
function drawPanel(){
  const tabs = [["acc","حساب من"],["set","تنظیمات"]]; if(isAdmin()) tabs.push(["adm","سازنده‌ی سایت"]);
  if(tab==="adm" && !isAdmin()) tab = "acc";
  $("#panelBody").innerHTML = `<div class="tabs">${tabs.map(([k,n])=>`<button class="tab" aria-pressed="${k===tab}" onclick="tab='${k}';drawPanel()">${n}</button>`).join("")}</div>
    <div class="err" id="pMsg"></div>` + ({acc:accHTML, set:setHTML, adm:admHTML}[tab])();
}

/* --- حساب --- */
function accHTML(){
  const s = session();
  return `<div class="field"><label>نام</label><input id="pName" value="${esc(s.name)}"></div>
  <div class="field"><label>ایمیل</label><input value="${esc(s.email)}" disabled></div>
  <button class="cta" onclick="saveName()">ذخیره‌ی نام</button>
  ${fb ? `<button class="btn2" onclick="resetPass()">ارسال ایمیل تغییر رمز</button>`
       : `<hr><div class="field"><label>تغییر رمز عبور</label><input id="pOld" type="password" placeholder="رمز فعلی"><input id="pNew" type="password" placeholder="رمز جدید (حداقل ۶ کاراکتر)"></div><button class="btn2" onclick="changePass()">تغییر رمز</button>`}
  <hr><button class="btn2" onclick="closePanel();logout()">خروج از حساب</button>
  ${fb ? "" : `<button class="btn2 danger" onclick="delAcc()">حذف حساب</button>`}`;
}
async function saveName(){
  const n = $("#pName").value.trim(); if(!n) return msg("نام نمی‌تواند خالی باشد.", false);
  if(fb){ try{ await fb.updateProfile(fb.auth.currentUser, {displayName:n}); }catch(e){ return msg("ذخیره نشد. دوباره تلاش کنید.", false); } }
  else { const U = users(); U[cur.email].name = n; store.set("rad_users", U); }
  cur.name = n; authUI(); drawPanel(); msg("نام ذخیره شد ✓");
}
async function changePass(){
  const o = $("#pOld").value, n = $("#pNew").value, U = users(), u = U[cur.email];
  if(n.length < 6) return msg("رمز جدید باید حداقل ۶ کاراکتر باشد.", false);
  if(u.hash !== await sha(u.salt+o)) return msg("رمز فعلی درست نیست.", false);
  u.salt = Math.random().toString(36).slice(2); u.hash = await sha(u.salt+n); store.set("rad_users", U);
  drawPanel(); msg("رمز عبور تغییر کرد ✓");
}
async function resetPass(){ try{ await fb.sendPasswordResetEmail(fb.auth, cur.email); msg("ایمیل تغییر رمز ارسال شد ✓"); }catch(e){ msg("ارسال نشد. دوباره تلاش کنید.", false); } }
function delAcc(){
  if(!confirm("حساب شما برای همیشه حذف شود؟")) return;
  const U = users(); delete U[cur.email]; store.set("rad_users", U); closePanel(); logout();
}

/* --- تنظیمات --- */
function setHTML(){
  const o = (v,n,cur) => `<option value="${v}" ${String(cur)===String(v)?"selected":""}>${n}</option>`;
  return `<div class="field"><label>حالت نمایش</label><select onchange="setPref('theme',this.value)">${o("auto","خودکار (مثل دستگاه)",prefs.theme)}${o("light","روشن",prefs.theme)}${o("dark","تیره",prefs.theme)}</select></div>
  <div class="field"><label>اندازه‌ی متن</label><select onchange="setPref('font',this.value)">${o(14,"کوچک",prefs.font)}${o(16,"متوسط",prefs.font)}${o(18,"بزرگ",prefs.font)}${o(20,"خیلی بزرگ",prefs.font)}</select></div>
  <label><input type="checkbox" ${prefs.ticker?"checked":""} onchange="setPref('ticker',this.checked)">نمایش نوار قیمت بالای سایت</label>
  <p class="hint">تنظیمات در همین مرورگر ذخیره می‌شود.</p>`;
}

/* --- سازنده‌ی سایت --- */
function admHTML(){
  const U = users();
  const f = (id,ph,t="input") => t==="area" ? `<textarea id="${id}" rows="5" placeholder="${ph}"></textarea>` : `<input id="${id}" placeholder="${ph}">`;
  return `<p class="hint">نوشته‌ها: ${fa(posts.length)} · خبرها: ${fa(NEWS.length)} · حساب‌های این مرورگر: ${fa(Object.keys(U).length)}</p>
  <p class="hint">تغییرات فقط در همین مرورگر ذخیره می‌شود. برای انتشار برای همه، «کپی کد» را بزنید و در فایل سایت جایگزین کنید.</p>
  <details open><summary>افزودن نوشته</summary>${f("aT","عنوان")}${f("aC","دسته (مثلاً سلامت)")}${f("aL","خلاصه‌ی کوتاه")}${f("aB","متن؛ پاراگراف‌ها را با یک خط خالی جدا کنید","area")}<button class="cta" onclick="addPost()">انتشار نوشته</button></details>
  <details><summary>افزودن خبر</summary>${f("nH","تیتر خبر")}${f("nT","دسته (ارز، ورزش، ...)")}${f("nP","متن کوتاه خبر")}${f("nS","منبع")}<button class="cta" onclick="addNews()">انتشار خبر</button></details>
  <details><summary>ویرایش نرخ‌ها</summary>${MARKET.items.map((x,i)=>`<div class="field"><label>${x.n} (تومان)</label><input id="r${i}" type="number" value="${x.v}"></div>`).join("")}
    <div class="field"><label>اونس طلا (دلار)</label><input id="rO" type="number" value="${MARKET.ounce}"></div>
    <div class="field"><label>برچسب تاریخ</label><input id="rD" value="${esc(MARKET.date.replace(" (زنده)",""))}"></div>
    <button class="cta" onclick="saveRates()">ذخیره‌ی نرخ‌ها</button></details>
  <details><summary>مدیریت نوشته‌ها و خبرها</summary>
    ${posts.map((x,i)=>`<div class="li"><span>${esc(x.title)}</span><button onclick="delItem('posts',${i})">حذف</button></div>`).join("")}
    ${NEWS.map((x,i)=>`<div class="li"><span>${esc(x.h)}</span><button onclick="delItem('NEWS',${i})">حذف</button></div>`).join("")}</details>
  <details><summary>حساب‌های ثبت‌شده در این مرورگر</summary>${Object.entries(U).map(([e,u])=>`<div class="li"><span>${esc(u.name)}</span><span dir="ltr">${esc(e)}</span></div>`).join("") || "<p class='hint'>حسابی نیست.</p>"}</details>
  <button class="cta" onclick="copyCode()">کپی کد برای فایل سایت</button>
  <textarea id="codeOut" rows="4" readonly style="display:none" dir="ltr"></textarea>`;
}
const val = id => $("#"+id).value.trim();
function addPost(){
  const t = val("aT"), c = val("aC"), l = val("aL"), body = val("aB").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(!t || !c || !body.length) return msg("عنوان، دسته و متن را پر کنید.", false);
  posts.unshift({ id:"p"+Date.now().toString(36), title:t, cat:c, lead:l || body[0].slice(0,90),
    date:new Date().toLocaleDateString("fa-IR",{day:"numeric",month:"long",year:"numeric"}),
    min:Math.max(1,Math.round(body.join(" ").split(/\s+/).length/150)), h:Math.floor(Math.random()*360), body });
  persist(); drawPanel(); msg("نوشته منتشر شد ✓");
}
function addNews(){
  const h = val("nH"), t = val("nT"), p = val("nP"), s2 = val("nS");
  if(!h || !p) return msg("تیتر و متن خبر را پر کنید.", false);
  NEWS.unshift({t:t||"خبر", h, p, s:s2||"—"}); persist(); drawPanel(); msg("خبر منتشر شد ✓");
}
function saveRates(){
  MARKET.items.forEach((x,i)=>{ const v = +$("#r"+i).value; if(v>0) x.v = v; });
  MARKET.ounce = +$("#rO").value || MARKET.ounce; MARKET.date = val("rD") || MARKET.date; MARKET.live = false;
  renderTicker(); persist(); drawPanel(); msg("نرخ‌ها ذخیره شد ✓");
}
function delItem(k,i){ if(!confirm("حذف شود؟")) return; (k==="posts"?posts:NEWS).splice(i,1); persist(); drawPanel(); }
function copyCode(){
  const code = `const posts = ${JSON.stringify(posts,null,2)};\nconst NEWS = ${JSON.stringify(NEWS,null,2)};\nconst MARKET = ${JSON.stringify({...MARKET,live:false},null,2)};`;
  const o = $("#codeOut"); o.value = code; o.style.display = ""; o.select();
  (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(()=>msg("کد کپی شد ✓"), ()=>msg("کد را از کادر پایین کپی کنید."));
}

applyPrefs();

// reading progress
addEventListener("scroll",()=>{ const d=document.documentElement; $("#progress").style.width = (d.scrollTop/(d.scrollHeight-d.clientHeight||1)*100)+"%"; });
$("#year").textContent = new Date().toLocaleDateString("fa-IR",{year:"numeric"});
addEventListener("hashchange",route);
renderTicker();
authUI();
route();
initAuth();
loadLive();
</script>
